name: 📦 Generate Projects

on:
  schedule:
    - cron: "17 4 * * 1"
  push:
    paths:
      - shelf/shelf.config.json
      - py-codes/generate_projects.py
      - .github/workflows/shelf.yml
  workflow_dispatch:

jobs:
  build-projects:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 🛎️ Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 📦 Generate Projects SVG
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
        run: python py-codes/generate_projects.py

      - name: 📸 Verify SVG was created
        run: ls -lh projects.svg

      - name: 🚀 Commit and Push
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "📦 Projects update [skip ci]"
          file_pattern: projects.svg README.md
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"
